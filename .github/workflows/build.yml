name: Build iSightCam

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DirectShow BaseClasses
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-classic-samples.git wcs
          Push-Location wcs
          git sparse-checkout set Samples/Win7Samples/multimedia/directshow/baseclasses
          Pop-Location
          Copy-Item -Recurse "wcs/Samples/Win7Samples/multimedia/directshow/baseclasses" "./baseclasses"
          Get-ChildItem ./baseclasses | Select-Object -First 5

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64
        shell: cmd
        run: build.cmd x64

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86
        shell: cmd
        run: build.cmd x86

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item iSightCam64.ax, iSightCam32.ax package/
          Copy-Item obj\flt-x64\iSightCam64.ax.map, obj\flt-x86\iSightCam32.ax.map package/ -ErrorAction SilentlyContinue
          # The .bat / .txt files carry Chinese text.  cmd.exe reads them in
          # the *console* codepage (936 on a Chinese Windows), so a UTF-8
          # file shows up as garbled text ("乱码").  Re-encode to GBK with
          # CRLF line endings -- that is what cmd expects natively.
          $gbk = [Text.Encoding]::GetEncoding(936)
          foreach ($f in "install-all.bat", "uninstall-all.bat", "README-install.txt") {
            $text = [IO.File]::ReadAllText("installer\$f", [Text.Encoding]::UTF8)
            $text = ($text -replace "`r`n", "`n") -replace "`n", "`r`n"
            [IO.File]::WriteAllText("package\$f", $text, $gbk)
            Write-Host ("packaged {0} as GBK, {1} bytes" -f $f, (Get-Item "package\$f").Length)
          }
          $chk = [IO.File]::ReadAllText("package\install-all.bat", $gbk)
          if ($chk -notmatch "ISIGHTFILTER-BUILD-V15") { throw "install-all.bat does not carry the V15 tag" }
          Write-Host "[OK] install-all.bat reads back as GBK and carries the V15 tag"
          $src = "https://github.com/Andrew-Dyachenko/apple-firewire-isight-on-windows/raw/main/CMU%201394%20Digital%20Camera%20Driver%206.4.6%20(signed)%20(September%2026%2C%202011).exe"
          Invoke-WebRequest -Uri $src -OutFile "package/1394camera646.exe"
          Get-ChildItem package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSightCam-package
          path: package/

  # ------------------------------------------------------------------
  # Pushing a v* tag publishes a GitHub Release with the installer zip
  # attached.  Everything is built from the tagged commit, so a release
  # is reproducible and never depends on files lying around locally.
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download the installer package
        uses: actions/download-artifact@v4
        with:
          name: iSightCam-package
          path: package

      - name: Zip it
        shell: pwsh
        run: |
          $name = "iSightCam-${{ github.ref_name }}-win.zip"
          # the .map files are only useful when debugging a build, keep the
          # download tidy for end users
          $files = Get-ChildItem package -File | Where-Object { $_.Extension -ne '.map' } |
                   Select-Object -ExpandProperty FullName
          Compress-Archive -Path $files -DestinationPath $name
          Get-Item $name | Format-List Name, Length
          "ASSET=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: iSightCam ${{ github.ref_name }}
          files: ${{ env.ASSET }}
          generate_release_notes: false
          body: |
            Apple iSight（FireWire）在 Windows 10 / 11 上作为标准摄像头使用。

            ### 下载
            下面那个 zip 就是完整安装包，解压后按顺序做：
            1. 双击 `1394camera646.exe` 安装 CMU 1394 内核驱动，**装完必须重启**
            2. 接好 FireWire 卡与相机，用 1394Camera Demo 确认有画面
            3. 右键 `install-all.bat` → 以管理员身份运行
            4. 微信 / QQ / OBS / 腾讯会议里选 **Apple iSight (FireWire)**

            ### 本版修复
            - **"设备在列表里但画面永远黑"**：DirectShow 基类的取流循环只要
              `Deliver()` 返回过一次非 `S_OK` 就会永久退出工作线程。本版接管该循环，
              被拒样本按 10ms 重试而不是当场判死，并在日志里打印 `STREAM PARKED`。
            - 总线复位自愈：通话中相机断电/重插，5–10 秒自动恢复画面。
            - `[layout]` 给微信的竖屏通话窗做裁剪（只对指定宿主生效，QQ 不受影响）。
            - 完整的取流日志：`%LOCALAPPDATA%\iSightCam.log`

            ### 已知限制
            - **无麦克风**（iSight 麦克风走独立的 FireWire 音频通道，Windows 驱动栈不支持），
              请先用其它麦克风；音频链路正在研究。
            - 分辨率固定 640×480（硬件规格）。
            - Windows 11 24H2+ 内核策略较严，CMU 驱动可能装不上，建议以 Windows 10 为主。

            详见仓库 [README](../../blob/main/README.md)。

  diag:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe driver toolchain (WDK)
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            '=== Windows Kits\10\Include ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
            '=== km headers (ntddk.h) ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\*\km\ntddk.h' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            '=== 1394 DDK headers ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\*\shared\1394.h' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\*\shared\1394common.h' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            '=== km libs ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib\*\km\x64\ntoskrnl.lib' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            '=== WDK build targets (VS extension) ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\build' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
            '=== signtool / inf2cat ==='
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\inf2cat.exe' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            '=== New-SelfSignedCertificate ==='
            ((Get-Command New-SelfSignedCertificate -ErrorAction SilentlyContinue) -ne $null)
            '=== EWDK on disk? ==='
            Test-Path 'C:\EWDK'
          } *>&1 | Tee-Object -FilePath wdk-probe.txt

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build diagnostic tool
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /EHsc /GR /FS /Zc:twoPhase- /MD ^
             /D_CRT_SECURE_NO_WARNINGS /DMY1394CAMERA_EXPORTS ^
             /Icmu\1394camera ^
             diags\testcam.cpp ^
             cmu\1394camera\1394Camera.cpp ^
             cmu\1394camera\1394CamAcq.cpp ^
             cmu\1394camera\1394CamCap.cpp ^
             cmu\1394camera\1394CamRGB.cpp ^
             cmu\1394camera\1394CamReg.cpp ^
             cmu\1394camera\1394CamMem.cpp ^
             cmu\1394camera\1394CamPIO.cpp ^
             cmu\1394camera\1394CamSIO.cpp ^
             cmu\1394camera\1394CamFMR.cpp ^
             cmu\1394camera\1394CameraControl.cpp ^
             cmu\1394camera\1394CameraControlSize.cpp ^
             cmu\1394camera\1394CameraControlStrobe.cpp ^
             cmu\1394camera\1394CameraControlTrigger.cpp ^
             cmu\1394camera\ControlWrappers.cpp ^
             cmu\1394camera\1394main.c ^
             cmu\1394camera\isochapi.c ^
             cmu\1394camera\tables.c ^
             cmu\1394camera\debug.c ^
             setupapi.lib advapi32.lib user32.lib comctl32.lib ^
             /Fe:isight-diag.exe

          cl /nologo /O2 /W3 /EHsc /GR /FS /Zc:twoPhase- /MD ^
             /D_CRT_SECURE_NO_WARNINGS /DMY1394CAMERA_EXPORTS ^
             /Icmu\1394camera ^
             diags\testraw.cpp ^
             cmu\1394camera\1394Camera.cpp ^
             cmu\1394camera\1394CamAcq.cpp ^
             cmu\1394camera\1394CamCap.cpp ^
             cmu\1394camera\1394CamRGB.cpp ^
             cmu\1394camera\1394CamReg.cpp ^
             cmu\1394camera\1394CamMem.cpp ^
             cmu\1394camera\1394CamPIO.cpp ^
             cmu\1394camera\1394CamSIO.cpp ^
             cmu\1394camera\1394CamFMR.cpp ^
             cmu\1394camera\1394CameraControl.cpp ^
             cmu\1394camera\1394CameraControlSize.cpp ^
             cmu\1394camera\1394CameraControlStrobe.cpp ^
             cmu\1394camera\1394CameraControlTrigger.cpp ^
             cmu\1394camera\ControlWrappers.cpp ^
             cmu\1394camera\1394main.c ^
             cmu\1394camera\isochapi.c ^
             cmu\1394camera\tables.c ^
             cmu\1394camera\debug.c ^
             setupapi.lib advapi32.lib user32.lib comctl32.lib ^
             /Fe:isight-raw.exe

          cl /nologo /O2 /W3 /EHsc /GR /FS /Zc:twoPhase- /MD ^
             /D_CRT_SECURE_NO_WARNINGS ^
             diags\graphtest.cpp ^
             strmiids.lib ole32.lib oleaut32.lib uuid.lib user32.lib ^
             /Fe:isight-graphtest.exe

          cl /nologo /O2 /W3 /EHsc /GR /FS /Zc:twoPhase- /MD ^
             /D_CRT_SECURE_NO_WARNINGS /DMY1394CAMERA_EXPORTS ^
             /Icmu\1394camera ^
             diags\audio.cpp ^
             cmu\1394camera\1394Camera.cpp ^
             cmu\1394camera\1394CamAcq.cpp ^
             cmu\1394camera\1394CamCap.cpp ^
             cmu\1394camera\1394CamRGB.cpp ^
             cmu\1394camera\1394CamReg.cpp ^
             cmu\1394camera\1394CamMem.cpp ^
             cmu\1394camera\1394CamPIO.cpp ^
             cmu\1394camera\1394CamSIO.cpp ^
             cmu\1394camera\1394CamFMR.cpp ^
             cmu\1394camera\1394CameraControl.cpp ^
             cmu\1394camera\1394CameraControlSize.cpp ^
             cmu\1394camera\1394CameraControlStrobe.cpp ^
             cmu\1394camera\1394CameraControlTrigger.cpp ^
             cmu\1394camera\ControlWrappers.cpp ^
             cmu\1394camera\1394main.c ^
             cmu\1394camera\isochapi.c ^
             cmu\1394camera\tables.c ^
             cmu\1394camera\debug.c ^
             setupapi.lib advapi32.lib user32.lib comctl32.lib ^
             /Fe:isight-audio.exe

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build 32-bit graph test (WeChat/QQ are often 32-bit)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /EHsc /GR /FS /Zc:twoPhase- /MD ^
             /D_CRT_SECURE_NO_WARNINGS ^
             diags\graphtest.cpp ^
             strmiids.lib ole32.lib oleaut32.lib uuid.lib user32.lib ^
             /Fe:isight-graphtest32.exe

      - name: Upload diagnostic tool
        uses: actions/upload-artifact@v4
        with:
          name: isight-diag
          path: |
            isight-diag.exe
            isight-raw.exe
            isight-audio.exe
            isight-graphtest.exe
            isight-graphtest32.exe
            wdk-probe.txt

  # ------------------------------------------------------------------
  # Reconnaissance for the virtual microphone.
  #
  # The iSight mic can only reach WeChat / QQ / OBS through a real capture
  # endpoint, and that means a kernel-mode PortCls driver.  portcls.h is
  # NOT in the plain Windows SDK (it ships with the WDK), and the runner
  # image may or may not have it.  Every step below is allowed to fail --
  # a red mark here is an answer, not a broken build.  See
  # drivers/kmprobe.c and drivers/pcprobe.cpp for the two compile tests.
  # ------------------------------------------------------------------
  kmprobe:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe the kernel audio toolchain
        shell: pwsh
        continue-on-error: true
        run: |
          & {
            '=== headers under Windows Kits\10\Include ==='
            foreach ($h in 'ntddk.h','wdm.h','ks.h','ksmedia.h','portcls.h','drmk.h') {
              $p = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Filter $h -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
              '{0,-12} {1}' -f $h, $p
            }
            '=== km x64 libs (10.0.26100.0) ==='
            (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64\*.lib' -ErrorAction SilentlyContinue |
             Select-Object -ExpandProperty Name) -join ' '
            '=== audio libs anywhere under Lib ==='
            foreach ($l in 'portcls.lib','ks.lib','drmk.lib') {
              $p = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib' -Filter $l -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
              '{0,-12} {1}' -f $l, $p
            }
            '=== km crt headers ==='
            (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km\crt' -ErrorAction SilentlyContinue |
             Select-Object -ExpandProperty Name) -join ' '
          } *>&1 | Tee-Object -FilePath kmprobe.txt

      - name: Is the MSVAD sample reachable?
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/Windows-classic-samples.git wcs 2>&1 | Out-Null
          Push-Location wcs
          git sparse-checkout set Samples/Win7Samples/multimedia/audio/msvad 2>&1 | Out-Null
          Pop-Location
          $root = 'wcs/Samples/Win7Samples/multimedia/audio/msvad'
          if (Test-Path $root) {
            '=== top level ==='
            Get-ChildItem $root | Select-Object -ExpandProperty Name
            '=== source files ==='
            Get-ChildItem $root -Recurse -Include *.cpp,*.h,*.rc,*.inf -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name
          } else { 'msvad NOT FOUND at ' + $root }

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Can this runner build a .sys at all?
        shell: cmd
        continue-on-error: true
        run: |
          set KIT=C:\Program Files (x86)\Windows Kits\10
          cl /nologo /kernel /c /W4 /O2 ^
             /I"%KIT%\Include\10.0.26100.0\km" ^
             /I"%KIT%\Include\10.0.26100.0\km\crt" ^
             /I"%KIT%\Include\10.0.26100.0\shared" ^
             drivers\kmprobe.c
          if errorlevel 1 exit /b 1
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /MACHINE:X64 ^
             /LIBPATH:"%KIT%\Lib\10.0.26100.0\km\x64" ^
             ntoskrnl.lib hal.lib wmilib.lib ^
             /OUT:kmprobe.sys kmprobe.obj
          if errorlevel 1 exit /b 1
          dir kmprobe.sys

      - name: Can we compile against portcls.h?
        shell: cmd
        continue-on-error: true
        run: |
          set KIT=C:\Program Files (x86)\Windows Kits\10
          cl /nologo /kernel /c /W4 /O2 ^
             /I"%KIT%\Include\10.0.26100.0\km" ^
             /I"%KIT%\Include\10.0.26100.0\km\crt" ^
             /I"%KIT%\Include\10.0.26100.0\shared" ^
             /I"%KIT%\Include\10.0.26100.0\um" ^
             drivers\pcprobe.cpp
          if errorlevel 1 exit /b 1
          dir pcprobe.obj

      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmprobe
          path: kmprobe.txt
