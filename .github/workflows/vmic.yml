name: Build iSight Virtual Mic

# Builds isightmic.sys (a PortCls WaveCyclic capture miniport) plus its two
# user-mode companions -- isight-micsvc.exe (the audio feeder) and
# isight-micdev.exe (the root-enumerated device installer) -- test-signs the
# driver with a throwaway self-signed cert, and uploads a ready-to-install
# package as the "isight-vmic" artifact.
#
# Test-signed: the target machine must boot once with `bcdedit /set testsigning
# on` (see README-mic.txt in the artifact).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vmic:
    runs-on: windows-2022
    # A hung signing step must not sit here for the 6h default.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tools/make_sample_wav.py needs a real interpreter; do not assume the
      # image's `python` resolves to anything but the Store alias.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Locate or install the WDK
        shell: pwsh
        run: |
          $wdk = 'C:\Program Files (x86)\Windows Kits\10'
          if (Test-Path "$wdk\Include\10.0.26100.0\km\ntddk.h") {
            Write-Host "system WDK present at $wdk"
          } else {
            Write-Host "system WDK not found, installing WDK NuGet package ..."
            if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
              Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
            }
            .\nuget.exe install Microsoft.Windows.WDK.x64 -Version 10.0.26100.6584 -ExcludeVersion -OutputDirectory wdkpkg
            $wdk = Resolve-Path wdkpkg\Microsoft.Windows.WDK.x64
          }
          "WDK_ROOT=$wdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build isightmic.sys (kernel PortCls miniport)
        shell: cmd
        run: |
          set KIT=%WDK_ROOT%
          REM _AMD64_ is normally injected by the WDK's MSBuild platform toolset
          REM (WindowsKernelModeDriver10.0).  We drive cl directly, so we must
          REM define the target architecture ourselves -- otherwise the SDK's
          REM shared\ntdef.h aborts with C1189 "No Target Architecture" before
          REM it ever reaches our code.
          REM /Fo: cl puts the object file in the *current* directory, not next
          REM to the source, so pin it -- otherwise link looks in the wrong place.
          REM /GS-: a kernel driver must not pull in the user-mode CRT's GS
          REM handler (LIBCMT's gs_report.obj wants UnhandledExceptionFilter).
          cl /nologo /kernel /c /W3 /O2 /D_AMD64_ /GS- /Fo:isightmic.obj ^
             /I"%KIT%\Include\10.0.26100.0\km" ^
             /I"%KIT%\Include\10.0.26100.0\km\crt" ^
             /I"%KIT%\Include\10.0.26100.0\shared" ^
             /I"%KIT%\Include\10.0.26100.0\um" ^
             drivers\isightmic\isightmic.cpp
          if errorlevel 1 exit /b 1
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /MACHINE:X64 ^
             /NODEFAULTLIB:LIBCMT /NODEFAULTLIB:LIBCMTD /NODEFAULTLIB:MSVCRT ^
             /LIBPATH:"%KIT%\Lib\10.0.26100.0\km\x64" ^
             portcls.lib ks.lib ksguid.lib drmk.lib ntoskrnl.lib hal.lib ^
             wmilib.lib wdmsec.lib BufferOverflowK.lib ^
             /OUT:isightmic.sys isightmic.obj
          if errorlevel 1 exit /b 1
          dir isightmic.sys

      - name: Build feeder and device installer (user mode)
        shell: cmd
        run: |
          cl /nologo /O2 /W3 /EHsc /MD /I"drivers\isightmic" service\feed.cpp /Fe:isight-micsvc.exe
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /W3 /EHsc /MD /DUNICODE /D_UNICODE tools\micdev.cpp setupapi.lib newdev.lib /Fe:isight-micdev.exe
          if errorlevel 1 exit /b 1
          dir isight-micsvc.exe isight-micdev.exe

      # isight-miccheck.exe is the confidence check: it opens the control
      # device, watches the driver counters, enumerates capture endpoints and
      # records what actually comes back out of the endpoint.  It is a
      # convenience, not the product, so a compile error in it must NOT cost us
      # the driver package -- hence continue-on-error and the guarded copy
      # below.
      - name: Build the endpoint checker (optional)
        shell: cmd
        continue-on-error: true
        run: |
          cl /nologo /O2 /W3 /EHsc /MD /I"drivers\isightmic" ^
             tools\miccheck.cpp ole32.lib /Fe:isight-miccheck.exe
          if errorlevel 1 exit /b 1
          dir isight-miccheck.exe

      - name: Generate a sample WAV (for the M1 loopback test)
        shell: pwsh
        run: |
          python tools\make_sample_wav.py sample.wav
          if (-not (Test-Path sample.wav)) { throw "sample.wav was not created" }
          Get-Item sample.wav | Select-Object Name, Length

      # inf2cat ships with the WDK and signtool with the SDK, and on this image
      # they are not in the same bin subtree (nor necessarily in bin\x64 at
      # all), so search the whole Kits tree rather than guessing a path.
      - name: Locate the signing tools
        shell: pwsh
        run: |
          $kits = 'C:\Program Files (x86)\Windows Kits'
          foreach ($tool in 'inf2cat.exe', 'signtool.exe') {
            $hit = Get-ChildItem $kits -Recurse -Filter $tool -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
            if ($hit) {
              Write-Host ("FOUND {0} -> {1}" -f $tool, $hit)
              "{0}_PATH={1}" -f ($tool -replace '\.exe$', ''), $hit |
                Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            } else {
              Write-Host ("MISSING {0}" -f $tool)
            }
          }
          Write-Host '=== Windows Kits\10\bin subtrees ==='
          Get-ChildItem "$kits\10\bin" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      # -------------------------------------------------------------------
      # Test-signing.  One landmine here, hit twice already: importing the
      # throwaway cert into the machine's Root store makes certutil /
      # Import-Certificate pop a confirmation dialog that nobody answers, so
      # the step sits there until the job times out.  The log of run
      # 35746443369 ends exactly that way --
      #     [4/6] trusting the cert for this runner only
      #     ##[error]The operation was canceled.      (7 minutes later)
      # So: create the cert, export the .cer, and let the *target* machine
      # trust it (install-mic.bat does that, no dialog can block it there).
      # Every sub-step also prints a marker first, so a stall is localisable.
      # -------------------------------------------------------------------
      - name: Test-sign the driver and build its catalog
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'
          # Progress markers: if this ever stalls again the log says where.
          Write-Host "[1/6] checking tools"
          if (-not $env:inf2cat_PATH) { throw "inf2cat.exe not found anywhere under Windows Kits" }
          if (-not $env:signtool_PATH) { throw "signtool.exe not found anywhere under Windows Kits" }
          Write-Host "  inf2cat  = $env:inf2cat_PATH"
          Write-Host "  signtool = $env:signtool_PATH"

          Write-Host "[2/6] staging micpkg"
          New-Item -ItemType Directory -Force -Path micpkg | Out-Null
          # The INF lives next to its source, not at the repo root.
          Copy-Item drivers\isightmic\isightmic.inf micpkg\isightmic.inf -Force
          Copy-Item isightmic.sys micpkg\isightmic.sys -Force
          Get-Item micpkg\isightmic.sys | Select-Object Name, Length

          Write-Host "[3/6] creating a throwaway self-signed code-signing cert"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                  -Subject "CN=iSightMic Test" `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -KeyUsage DigitalSignature `
                  -NotAfter (Get-Date).AddYears(10)
          Write-Host "  thumbprint = $($cert.Thumbprint)"
          Export-Certificate -Cert $cert -FilePath micpkg\iSightMicTest.cer | Out-Null
          Get-Item micpkg\iSightMicTest.cer | Select-Object Name, Length

          # Deliberately NOT trusted into Root here.  signtool *signs* fine with a
          # self-signed cert (it printed "Successfully signed" for both files
          # before this comment existed); only `signtool verify` demands a
          # trusted chain, and that is a check for the target machine anyway.
          Write-Host "[4/6] building the catalog from the INF"
          & $env:inf2cat_PATH /driver:micpkg /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "inf2cat failed ($LASTEXITCODE)" }

          Write-Host "[5/6] signing the driver and the catalog"
          foreach ($f in 'micpkg\isightmic.sys', 'micpkg\isightmic.cat') {
            & $env:signtool_PATH sign /fd SHA256 /sha1 $cert.Thumbprint $f
            if ($LASTEXITCODE -ne 0) { throw "sign $f failed ($LASTEXITCODE)" }
          }

          Write-Host "[6/6] done"
          # No `signtool verify` here on purpose: /pa requires the root to be
          # trusted, which a throwaway test cert never is, so it would only ever
          # report a failure that does not matter.
          Get-ChildItem micpkg | Select-Object Name, Length

      - name: Assemble package
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item micpkg\* pkg\ -Force
          Copy-Item isight-micsvc.exe, isight-micdev.exe, sample.wav pkg\ -Force
          Copy-Item isight-miccheck.exe pkg\ -ErrorAction SilentlyContinue
          # The .bat / .txt carry Chinese text.  cmd.exe reads them in the console
          # codepage (936 on a Chinese Windows), so a UTF-8 file shows up as
          # garbled text -- re-encode to GBK with CRLF, which is what cmd wants.
          $gbk = [Text.Encoding]::GetEncoding(936)
          foreach ($f in "install-mic.bat", "uninstall-mic.bat", "README-mic.txt") {
            $text = [IO.File]::ReadAllText("drivers\$f", [Text.Encoding]::UTF8)
            $text = ($text -replace "`r`n", "`n") -replace "`n", "`r`n"
            [IO.File]::WriteAllText("pkg\$f", $text, $gbk)
          }
          Get-ChildItem pkg | Select-Object Name, Length
          # Hashes so we can prove later which build the target machine got.
          Get-ChildItem pkg -File | ForEach-Object {
            "{0,10}  {1}  {2}" -f $_.Length,
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash.Substring(0, 16), $_.Name
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: isight-vmic
          path: pkg/

      # A signing problem must not cost us the binaries: the compile/link half
      # of this job is the expensive, hard-won part, and the signing half is
      # just toolchain plumbing.  If signing fails, still ship what we built so
      # the driver can be signed and installed by another route.
      - name: Upload the unsigned binaries as a fallback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isight-vmic-unsigned
          path: |
            isightmic.sys
            isight-micsvc.exe
            isight-micdev.exe
            isight-miccheck.exe
            sample.wav
            drivers/isightmic/isightmic.inf
            drivers/isightmic/isightmic.h
            drivers/install-mic.bat
            drivers/uninstall-mic.bat
            drivers/README-mic.txt
            micpkg/iSightMicTest.cer
          if-no-files-found: warn
